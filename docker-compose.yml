services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leitor_faturas_bi
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:////app/data/financial.db
      - SECRET_KEY=chave-local-segura-fintech-prod
    volumes:
      # Persistência dos dados locais (banco SQLite e uploads)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
